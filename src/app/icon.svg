<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow-md" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow-lg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow-badge" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#60a5fa" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo azul -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="url(#glass)" stroke-width="8" />

  <!-- Edificio Municipal -->
  <g transform="translate(0, 24)">
    <!-- Escalera base inferior -->
    <path d="M28 396 H484 C496 396 504 404 504 416 V446 C504 458 496 466 484 466 H28 C16 466 8 458 8 446 V416 C8 404 16 396 28 396 Z" fill="#1d4ed8" filter="url(#shadow-md)" />
    <!-- Plataforma media -->
    <path d="M60 340 H452 C464 340 472 348 472 360 V380 C472 392 464 400 452 400 H60 C48 400 40 392 40 380 V360 C40 348 48 340 60 340 Z" fill="#3b82f6" filter="url(#shadow-md)" />

    <!-- 4 Columnas blancas -->
    <g filter="url(#shadow-md)" fill="#ffffff">
      <rect x="76"  y="160" width="60" height="180" rx="8" />
      <rect x="176" y="160" width="60" height="180" rx="8" />
      <rect x="276" y="160" width="60" height="180" rx="8" />
      <rect x="376" y="160" width="60" height="180" rx="8" />
    </g>

    <!-- Capiteles y bases de columnas -->
    <g fill="#e2e8f0">
      <rect x="68"  y="152" width="76" height="16" rx="5" />
      <rect x="168" y="152" width="76" height="16" rx="5" />
      <rect x="268" y="152" width="76" height="16" rx="5" />
      <rect x="368" y="152" width="76" height="16" rx="5" />
      <rect x="68"  y="322" width="76" height="16" rx="5" />
      <rect x="168" y="322" width="76" height="16" rx="5" />
      <rect x="268" y="322" width="76" height="16" rx="5" />
      <rect x="368" y="322" width="76" height="16" rx="5" />
    </g>

    <!-- Frontón / sombra interior -->
    <path d="M256 0 L496 144 V164 H16 Z" fill="#1e3a8a" filter="url(#shadow-md)" />
    <!-- Frontón principal -->
    <path d="M256 0 L496 144 H16 Z" fill="url(#roofGrad)" />
    <!-- Sombra interior del frontón -->
    <path d="M256 36 L430 134 H82 Z" fill="#0f172a" opacity="0.35" />

    <!-- Reloj central en el frontón -->
    <circle cx="256" cy="90" r="30" fill="#93c5fd" filter="url(#shadow-md)" />
    <circle cx="256" cy="90" r="16" fill="#ffffff" />
    <!-- Manecillas del reloj -->
    <line x1="256" y1="90" x2="256" y2="78" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="90" x2="264" y2="96" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sello de reserva (badge con check) -->
  <g transform="translate(256, 344)" filter="url(#shadow-lg)">
    <circle cx="0" cy="0" r="120" fill="url(#badgeGrad)" filter="url(#glow-badge)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.7" />
    <!-- Checkmark grande -->
    <path d="M-50 4 L-15 45 L55 -25" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brillo glassmorphism superior -->
  <path d="M0 100 C0 44.8 44.8 0 100 0 H412 C467.2 0 512 44.8 512 100 V200 C350 260 160 220 0 180 Z" fill="url(#glass)" />
</svg>
